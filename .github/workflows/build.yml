name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # pastreaza Gradle intre build-uri: build-urile urmatoare sunt mult mai rapide
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --no-audit --no-fund
      # aceeasi semnatura la fiecare build = update peste aplicatia existenta, fara pierderea datelor
      - run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; else echo "::error::debug.keystore lipseste - APK-ul ar avea alta semnatura, nu s-ar instala peste cel vechi si ai pierde datele. Urca debug.keystore in repo."; exit 1; fi
      - run: |
          mkdir -p www
          cp index.html www/index.html
      - run: npx cap add android
      - name: Build cu widget, scurtatura si romana offline
        id: full
        continue-on-error: true
        run: |
          python3 build_android.py --extras
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Build de rezerva (fara widget)
        if: steps.full.outcome == 'failure'
        run: |
          echo "::warning::Build-ul complet a esuat - APK-ul NU are widget, scurtatura si romana offline. Vezi pasul 'Build cu widget...' pentru eroare."
          rm -rf android
          npx cap add android
          python3 build_android.py
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Secretara build ${{ github.run_number }} ${{ steps.full.outcome == 'success' && '(complet)' || '(fara widget)' }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: secretara-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
