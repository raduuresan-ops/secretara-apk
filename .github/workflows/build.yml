name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; else echo "debug.keystore lipseste - semnatura temporara"; fi
      - run: |
          mkdir -p www
          cp index.html www/index.html
      - run: npx cap add android
      - name: Build cu widget si scurtatura
        id: full
        continue-on-error: true
        run: |
          python3 build_android.py --extras
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Build de rezerva (fara widget)
        if: steps.full.outcome == 'failure'
        run: |
          rm -rf android
          npx cap add android
          python3 build_android.py
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Secretara build ${{ github.run_number }} ${{ steps.full.outcome == 'success' && '(cu widget)' || '(fara widget)' }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: secretara-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
